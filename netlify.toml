# public/ is built from src/ by `npm run build` and committed; Netlify publishes it as it is.
# Headers (CSP with hashes, caching, noindex) are in public/_headers, written by the build.
[build]
  command = ""
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/configurator/*"
  to = "/index.html"
  status = 200
