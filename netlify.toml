# public/ is built from src/ by tools/build.py and committed; build.sh only checks it.
[build]
  command = "sh build.sh"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The designer lives at /configurator/; v1 served it at /.
[[redirects]]
  from = "/"
  to = "/configurator/"
  status = 301
